name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: |
          unzip -q F1OfflinePatcher.zip
          cd F1OfflinePatcher
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: F1OfflinePatcher-apk
          path: F1OfflinePatcher/app/build/outputs/apk/debug/*.apk
